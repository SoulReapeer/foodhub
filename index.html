<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodHub — Order food you love</title>
  <link rel="stylesheet" href="frontend/css/style.css">
</head>
<body>
<div id="app">

  <!-- Hero -->
  <section class="page" style="padding-bottom:0">
    <div class="hero">
      <div class="hero__text">
        <h1 class="hero__title">Great food,<br><span>fast delivery.</span></h1>
        <p class="hero__sub">Discover the best restaurants near you and order in minutes.</p>
        <button class="btn btn-primary btn-lg" onclick="document.getElementById('restaurants-section').scrollIntoView({behavior:'smooth'})">
          Browse Restaurants →
        </button>
      </div>
      <div class="hero__emoji">🍱</div>
    </div>
  </section>

  <!-- Restaurants section -->
  <section class="page" id="restaurants-section">
    <div class="section-heading" style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h2>Restaurants</h2>
        <p id="result-count" style="color:var(--ink-3);font-size:14px;margin-top:2px"></p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="form-input" id="sort-select" style="width:auto;padding:8px 12px;font-size:13px">
          <option value="rating">Top Rated</option>
          <option value="name">A → Z</option>
        </select>
      </div>
    </div>

    <!-- Category chips -->
    <div class="filter-chips" id="category-chips">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="Biryani">🍛 Biryani</button>
      <button class="chip" data-cat="Pizza">🍕 Pizza</button>
      <button class="chip" data-cat="Burgers">🍔 Burgers</button>
      <button class="chip" data-cat="Chinese">🥟 Chinese</button>
      <button class="chip" data-cat="BBQ">🔥 BBQ</button>
      <button class="chip" data-cat="Japanese">🍣 Japanese</button>
    </div>

    <div id="restaurants-grid" class="restaurants-grid">
      <div class="loading-page"><div class="spinner"></div></div>
    </div>
  </section>
</div>

<script src="frontend/js/api.js"></script>
<script>
  renderNavbar('.');

  let allRestaurants = [];
  let activeCategory = '';
  let activeSort     = 'rating';

  // Read URL search param
  const urlQ = new URLSearchParams(location.search).get('q') || '';
  if (urlQ) {
    const inp = document.getElementById('nav-search-input');
    if (inp) inp.value = urlQ;
  }

  async function loadRestaurants() {
    const params = new URLSearchParams();
    if (urlQ)          params.set('q', urlQ);
    if (activeCategory) params.set('category', activeCategory);
    params.set('sort', activeSort);

    const grid = document.getElementById('restaurants-grid');
    grid.innerHTML = '<div class="loading-page"><div class="spinner"></div></div>';
    try {
      allRestaurants = await api.get(`/restaurants?${params}`);
      renderGrid(allRestaurants);
    } catch(e) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-state__icon">😞</div><h3>Could not load restaurants</h3><p>Make sure the backend is running on port 5000.</p></div>`;
    }
  }

  function renderGrid(list) {
    const grid = document.getElementById('restaurants-grid');
    document.getElementById('result-count').textContent = `${list.length} restaurant${list.length !== 1 ? 's' : ''} found`;
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state__icon">🔍</div><h3>No results</h3><p>Try a different search or category.</p></div>`;
      return;
    }
    grid.innerHTML = list.map(r => `
      <div class="restaurant-card" onclick="window.location='frontend/pages/restaurant.html?id=${r.restaurant_id}'">
        <img class="restaurant-card__img" src="${r.image_url || 'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=800&q=80'}" alt="${r.name}" loading="lazy">
        <div class="restaurant-card__body">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px">
            <h3 class="restaurant-card__name">${r.name}</h3>
            ${r.is_open ? '<span class="badge badge-green">Open</span>' : '<span class="badge badge-gray">Closed</span>'}
          </div>
          <div class="restaurant-card__meta">
            <span class="restaurant-card__rating">★ ${r.rating.toFixed(1)}</span>
            <span>·</span>
            <span class="restaurant-card__badge">${r.category || 'Restaurant'}</span>
            <span>·</span>
            <span>${r.location || ''}</span>
          </div>
          ${r.description ? `<p style="font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${r.description}</p>` : ''}
        </div>
      </div>
    `).join('');
  }

  // Category chips
  document.getElementById('category-chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    qsa('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeCategory = chip.dataset.cat;
    loadRestaurants();
  });

  // Sort
  document.getElementById('sort-select').addEventListener('change', e => {
    activeSort = e.target.value;
    loadRestaurants();
  });

  loadRestaurants();
</script>
</body>
</html>
