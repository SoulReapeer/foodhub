<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — FoodHub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page" style="max-width:720px">

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
    <a href="../index.html" style="color:var(--ink-3);font-size:13px">← Back</a>
    <h2>My Profile</h2>
  </div>

  <!-- Avatar + name card -->
  <div class="card" style="padding:28px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <div id="avatar-circle" style="width:72px;height:72px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:2rem;font-family:'Playfair Display',serif;font-weight:700;color:white;flex-shrink:0">?</div>
    <div style="flex:1">
      <div id="profile-name" style="font-size:1.4rem;font-family:'Playfair Display',serif;font-weight:700">—</div>
      <div id="profile-email" style="color:var(--ink-3);font-size:14px;margin-top:2px">—</div>
      <div id="profile-role" style="margin-top:6px"></div>
    </div>
    <div style="display:flex;gap:8px">
      <a href="orders.html" class="btn btn-ghost btn-sm">📦 My Orders</a>
    </div>
  </div>

  <!-- Edit form -->
  <div class="card" style="padding:28px;margin-bottom:20px">
    <h3 style="margin-bottom:20px;font-size:1rem">Personal Information</h3>

    <div id="success-banner" style="display:none;background:var(--green-bg);color:var(--green);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px">
      ✅ Profile updated successfully
    </div>
    <div id="error-banner" style="display:none;background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group" style="margin:0">
        <label class="form-label">Full name</label>
        <input class="form-input" id="field-name" type="text" placeholder="Your name">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Email address</label>
        <input class="form-input" id="field-email" type="email" disabled style="background:var(--surface-3);color:var(--ink-3)">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Phone number</label>
        <input class="form-input" id="field-phone" type="tel" placeholder="01700000000">
      </div>
      <div class="form-group" style="margin:0;grid-column:1/-1">
        <label class="form-label">Default delivery address</label>
        <textarea class="form-input" id="field-address" rows="2" style="resize:none" placeholder="Street, area, city…"></textarea>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-primary" id="save-btn" onclick="saveProfile()">Save Changes</button>
    </div>
  </div>

  <!-- Change password -->
  <div class="card" style="padding:28px;margin-bottom:20px">
    <h3 style="margin-bottom:6px;font-size:1rem">Change Password</h3>
    <p style="color:var(--ink-3);font-size:13px;margin-bottom:20px">Leave blank to keep your current password</p>

    <div id="pwd-error" style="display:none;background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group" style="margin:0">
        <label class="form-label">New password</label>
        <input class="form-input" id="new-pwd" type="password" placeholder="Min. 6 characters">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Confirm new password</label>
        <input class="form-input" id="confirm-pwd" type="password" placeholder="Repeat password">
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink-3);margin-top:6px">⚠ Password change is shown as UI-only in this portfolio demo.</p>
  </div>

  <!-- Danger zone -->
  <div class="card" style="padding:28px;border:1.5px solid #fee2e2">
    <h3 style="font-size:1rem;color:#b91c1c;margin-bottom:6px">Sign Out</h3>
    <p style="font-size:13px;color:var(--ink-3);margin-bottom:16px">You will be redirected to the login page.</p>
    <button class="btn btn-danger" onclick="doLogout('..')">Sign Out</button>
  </div>

</div>

<script src="../js/api.js"></script>
<script>
  renderNavbar('..');
  if (!requireAuth()) void 0;

  async function loadProfile() {
    try {
      const user = await api.get('/auth/me');
      // Update stored user
      saveAuth(getToken(), user);
      // Render
      const initials = user.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('avatar-circle').textContent = initials;
      document.getElementById('profile-name').textContent  = user.name;
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('profile-role').innerHTML    =
        user.role === 'admin'
          ? '<span class="badge badge-brand">⚙️ Admin</span>'
          : '<span class="badge badge-green">👤 Customer</span>';
      document.getElementById('field-name').value    = user.name || '';
      document.getElementById('field-email').value   = user.email || '';
      document.getElementById('field-phone').value   = user.phone || '';
      document.getElementById('field-address').value = user.address || '';
    } catch(e) {
      showToast('Could not load profile', 'error');
    }
  }

  async function saveProfile() {
    const name    = document.getElementById('field-name').value.trim();
    const phone   = document.getElementById('field-phone').value.trim();
    const address = document.getElementById('field-address').value.trim();
    const errEl   = document.getElementById('error-banner');
    const okEl    = document.getElementById('success-banner');
    const btn     = document.getElementById('save-btn');

    errEl.style.display = 'none';
    okEl.style.display  = 'none';
    if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const updated = await api.put('/auth/me', { name, phone, address });
      saveAuth(getToken(), updated);
      okEl.style.display = 'block';
      document.getElementById('profile-name').textContent  = updated.name;
      const initials = updated.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('avatar-circle').textContent = initials;
      setTimeout(() => { okEl.style.display = 'none'; }, 3000);
    } catch(e) {
      errEl.textContent   = e.message || 'Update failed';
      errEl.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Save Changes';
  }

  loadProfile();
</script>
</body>
</html>
